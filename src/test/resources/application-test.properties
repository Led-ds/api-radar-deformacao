# Configurações do perfil de teste
spring.datasource.url=jdbc:h2:mem:radar_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS radar
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# Feign / AWS Mocks para teste
aws.s3.bucket-name=test-bucket
aws.s3.region=us-east-1
aws.s3.access-key=test-key
aws.s3.secret-key=test-secret
