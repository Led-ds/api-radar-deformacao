spring.application.name=apiRadar

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/radar_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:radar_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:radar_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.auto-commit=false

# Chaves externas parametrizadas via variáveis de ambiente (Sem segredos hardcoded)
api.key.open.data.nasa=${NASA_API_KEY:}
api.key.weather=${WEATHER_API_KEY:}

aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:radar-imagesbucket}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

radar.territory.max-allowed-area-km2=${RADAR_TERRITORY_MAX_ALLOWED_AREA_KM2:250.0}

# Processamento InSAR (Barreira de segurança financeira - execução externa desabilitada por padrão)
radar.processing.hyp3.execution-enabled=${RADAR_PROCESSING_HYP3_EXECUTION_ENABLED:false}
radar.processing.hyp3.api-url=${RADAR_PROCESSING_HYP3_API_URL:https://hyp3-api.asf.alaska.edu}
