# ==============================================================================
# RADAR++ - DOCKER COMPOSE: FUNDAÇÃO TÉCNICA DO MVP (FATIA VERTICAL 1)
# ==============================================================================
services:
  # 1. Banco Espacial Relacional com PostGIS 3.4
  postgres:
    image: postgis/postgis:16-3.4
    container_name: radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar_db}
      POSTGRES_USER: ${POSTGRES_USER:-radar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_pass}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Monólito Modular (Spring Boot 3.3 / Java 21)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/radar_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-radar_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-radar_pass}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
      ASF_BASE_URL: https://api.daac.asf.alaska.edu
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Frontend Web SPA (React 18 / Vite / Leaflet)
  frontend:
    build:
      context: ../front_react/github-friend-helper
      dockerfile: Dockerfile
    container_name: radar_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ============================================================================
  # 4. Storage S3 Emulado (MinIO) - OPCIONAL / DESATIVADO POR PADRÃO
  # O armazenamento científico de COGs faz parte das fatias subsequentes (5.2+).
  # Para habilitar, descomente o bloco abaixo.
  # ============================================================================
  # minio:
  #   image: minio/minio:RELEASE.2024-05-10T01-41-38Z
  #   container_name: radar_minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: radar_admin
  #     MINIO_ROOT_PASSWORD: radar_minio_pass
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - radar_miniodata:/data

volumes:
  radar_pgdata:
    name: radar_pgdata
